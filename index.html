<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ORC Baseball Club 成績表</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h1>ORC Baseball Club 成績表</h1>
  <div id="scoreTable">読み込み中…</div>

  <!-- Tabletop.js の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/tabletop@1.6.0/tabletop.min.js"></script>
  <script>
    var publicSpreadsheetUrl = 'https://docs.google.com/spreadsheets/d/119bZBgox4lf5CURFeGfsFjMi2X9auUqCHRtmAHtXC1A/pubhtml';

    window.onload = function() {
      Tabletop.init({
        key: publicSpreadsheetUrl,
        callback: showInfo,
        simpleSheet: true
      });
    };

    function showInfo(data, tabletop) {
      if (!data || data.length === 0) {
        document.getElementById('scoreTable').innerHTML = 'データがありません';
        return;
      }

      let html = '<table><tr>';
      Object.keys(data[0]).forEach(function(key) {
        html += '<th>' + key + '</th>';
      });
      html += '</tr>';

      data.forEach(function(row) {
        html += '<tr>';
        Object.values(row).forEach(function(cell) {
          html += '<td>' + cell + '</td>';
        });
        html += '</tr>';
      });

      html += '</table>';
      document.getElementById('scoreTable').innerHTML = html;
    }
  </script>
</body>
</html>
