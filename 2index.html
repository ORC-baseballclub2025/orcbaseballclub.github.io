<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORC Baseball Club 成績表</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #fafafa;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    /* 横スクロール可能なテーブルコンテナ */
    #scoreTable {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch; /* スマホの慣性スクロール */
      background-color: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 600px; /* 横幅固定でスクロール可能に */
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #f2f2f2;
      position: sticky; /* ヘッダー固定 */
      top: 0;
      z-index: 1;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    /* スマホ用の文字サイズ調整 */
    @media screen and (max-width: 600px) {
      th, td {
        padding: 6px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <h1>ORC Baseball Club 成績表</h1>
  <div id="scoreTable">読み込み中…</div>

  <!-- Tabletop.js の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/tabletop@1.6.0/tabletop.min.js"></script>
  <script>
    var publicSpreadsheetUrl = 'https://docs.google.com/spreadsheets/d/119bZBgox4lf5CURFeGfsFjMi2X9auUqCHRtmAHtXC1A/pubhtml';

    window.onload = function() {
      Tabletop.init({
        key: publicSpreadsheetUrl,
        callback: showInfo,
        simpleSheet: true
      });
    };

    function showInfo(data, tabletop) {
      if (!data || data.length === 0) {
        document.getElementById('scoreTable').innerHTML = 'データがありません';
        return;
      }

      let html = '<table><thead><tr>';
      Object.keys(data[0]).forEach(function(key) {
        html += '<th>' + (key || '—') + '</th>';
      });
      html += '</tr></thead><tbody>';

      data.forEach(function(row) {
        html += '<tr>';
        Object.values(row).forEach(function(cell) {
          html += '<td>' + (cell || '—') + '</td>';
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      document.getElementById('scoreTable').innerHTML = html;
    }
  </script>
</body>
</html>
